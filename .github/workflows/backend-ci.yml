name: Backend CI

on:
  push:
    branches: [main, develop]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

defaults:
  run:
    working-directory: backend

jobs:
  test:
    name: Test, migrations, and API docs
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agri_super_app_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      FLASK_APP: wsgi.py
      FLASK_ENV: development
      SECRET_KEY: ci-secret-key-not-for-production
      JWT_SECRET_KEY: ci-jwt-secret-key-not-for-production
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/agri_super_app_ci"
      TEST_DATABASE_URL: "sqlite:///:memory:"
      CORS_ORIGINS: "http://localhost:3000"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install backend dependencies
        run: pip install -r requirements-dev.txt

      - name: Apply migrations to a clean database
        run: flask db upgrade

      - name: Verify no pending model changes are missing a migration
        run: flask db check

      - name: Run backend test suite
        run: pytest

      - name: Verify the app boots with Swagger enabled and serves its spec
        run: |
          python - <<'PYEOF'
          from app import create_app

          app = create_app("testing")
          client = app.test_client()

          spec_response = client.get("/apispec.json")
          assert spec_response.status_code == 200, spec_response.status_code
          spec = spec_response.get_json()
          assert spec["paths"], "Swagger spec has no documented paths."

          docs_response = client.get("/apidocs/")
          assert docs_response.status_code == 200, docs_response.status_code
          PYEOF
