[pytest]
# Ensures `import app` resolves regardless of which directory pytest is
# invoked from -- without this, running `pytest` from anywhere other
# than exactly the backend/ root can fail with ModuleNotFoundError.
pythonpath = .

testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts = -v --tb=short --cov=app --cov-report=term-missing --cov-report=html
